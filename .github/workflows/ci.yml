name: CI

on:
  push:
  pull_request:

# Recorded on every persisted run as its app_version, so replay can tell when
# a run came from a different build (docs/PLAN.md §14.3 B.8).
env:
  GIT_SHA: ${{ github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: agentnet_dev
          POSTGRES_DB: agentnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet_test
      # Fail, don't skip, the Postgres-backed tests if the service is down.
      AGENTNET_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned by the lockfiles (docs/PLAN.md §14.7 D3); regenerate with `make lock`.
      - name: Install backend
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: Ruff
        run: backend/.venv/bin/ruff check backend
      - name: Pytest
        working-directory: backend
        run: .venv/bin/pytest
      # docs/PLAN.md §8's testing strategy: every scenario/RNG-touching
      # change gets a same-seed-twice-identical determinism pass, not just
      # unit tests -- this is the headless CI equivalent of running it
      # locally before every commit.
      - name: Verify determinism
        working-directory: backend
        run: .venv/bin/python scripts/verify_determinism.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      # Next 16 generates PageProps/LayoutProps/RouteContext helpers on
      # demand (next dev/build/typegen) rather than shipping them as static
      # types -- `tsc --noEmit` alone errors on any route using them
      # without this.
      - name: Typegen
        working-directory: frontend
        run: npx next typegen
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  # Priority 1/productization of the benchmark-suite work: a fast pass/fail
  # gate (defense comparison + remediation before/after, not the full
  # 14-scenario matrix or the 2,500-agent scale run -- those stay a manual
  # `make benchmark`) proving the defense and remediation mechanisms actually
  # work, not just that the code runs. See README's "Benchmarks and demos".
  agentshield-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: agentshield test
        working-directory: backend
        run: .venv/bin/python scripts/agentshield_test.py

  # docs/PLAN.md §2.5/§8: every new endpoint flows through the OpenAPI ->
  # schema.d.ts typegen pipeline automatically, and is supposed to be
  # caught by a "make types && git diff --exit-code" drift check -- this
  # job is that check actually wired into CI (previously only run by hand).
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Start backend
        run: nohup backend/.venv/bin/uvicorn app.main:app --app-dir backend --port 8000 &
      - name: Wait for backend
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not become ready in time" >&2
          exit 1
      - name: Regenerate OpenAPI types
        working-directory: frontend
        run: npx openapi-typescript http://localhost:8000/openapi.json -o src/lib/api/schema.d.ts
      - name: Fail on schema drift
        run: git diff --exit-code -- frontend/src/lib/api/schema.d.ts

  # docs/PLAN.md §14.3 B.7/B.8: the images as built (no source mounts, no
  # hot reload) start healthy, run as non-root, and record this commit as
  # the app_version of the runs they persist.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -sf http://localhost:8000/health | grep -q '"postgres":"reachable"'
          curl -sf -o /dev/null http://localhost:3000
          for service in backend frontend; do
            uid=$(docker compose exec -T "$service" id -u)
            if [ "$uid" = "0" ]; then echo "$service runs as root" >&2; exit 1; fi
          done
          id=$(curl -sf -X POST http://localhost:8000/api/experiments \
            -H 'content-type: application/json' \
            -d '{"seed": 1, "node_count": 25, "max_ticks": 1}' | jq -r .experiment_id)
          version=$(curl -sf "http://localhost:8000/api/experiments/$id/detail" | jq -r .app_version)
          if [ "$version" != "$GIT_SHA" ]; then
            echo "run recorded app_version=$version, expected $GIT_SHA" >&2
            exit 1
          fi
      - name: Service logs
        if: failure()
        run: docker compose logs
