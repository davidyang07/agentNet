name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: agentnet_dev
          POSTGRES_DB: agentnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install -e "backend[dev]"
      - name: Ruff
        run: backend/.venv/bin/ruff check backend
      - name: Pytest
        working-directory: backend
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      # Next 16 generates PageProps/LayoutProps/RouteContext helpers on
      # demand (next dev/build/typegen) rather than shipping them as static
      # types -- `tsc --noEmit` alone errors on any route using them
      # without this.
      - name: Typegen
        working-directory: frontend
        run: npx next typegen
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
