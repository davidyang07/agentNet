services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnet"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The images as built: no hot reload, no source mounts. For development,
  # layer docker-compose.dev.yml on top (`make dev`).
  backend:
    build:
      context: ./backend
      args:
        # Recorded on every persisted run; `make up` passes the commit.
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Experiment/stream traffic goes browser -> backend directly, so
        # these must resolve from the host (not the "backend" Compose
        # hostname). Inlined at build time, so they're build arguments.
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        NEXT_PUBLIC_BACKEND_WS_URL: ws://localhost:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
